name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    needs: rust-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Matrix check (mechanical gate)
        run: cargo test --locked --test matrix
      - name: Corpus harness
        run: cargo test --locked --test corpus

  rust-quality:
    name: Rust (1.85.0)
    uses: wrightkit/.github/.github/workflows/rust-quality.yml@a83d0f1b4cbcb5b81fb0426e3a5aea1db0899fb5
    with:
      toolchain: 1.85.0
      cache-shared-key: linux-ci
