[package]
name = "deltin-rs"
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Workshop-independent OSTW/DeltinScript implementation: lexer, recoverable parser, project model, semantic analysis, typed HIR, and tooling APIs"
repository = "https://github.com/wrightkit/deltin-rs"
exclude = ["cli", "tests/fixtures/cli,source:case.del"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
workshop-rs = "=0.3.7"

[workspace]
members = [".", "cli"]
resolver = "2"

# Reduce dependency artifact volume while retaining line-table diagnostics for
# WrightKit code. See wrightkit/.github docs/rust-build-artifacts.md.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 1

[profile.test.package."*"]
debug = false

[profile.release]
lto = true
