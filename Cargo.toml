[package]
name = "deltin-rs"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Workshop-independent OSTW/DeltinScript implementation: lexer, recoverable parser, project model, semantic analysis, typed HIR, and tooling APIs"
repository = "https://github.com/wrightkit/deltin-rs"
exclude = ["cli", "tests/fixtures/cli,source:case.del"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
workshop-rs = "=0.1.15"

[workspace]
members = [".", "cli"]
resolver = "2"

[profile.release]
lto = true
